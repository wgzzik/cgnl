<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CS 1.6 Buy Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Facelift', Tahoma, Arial, sans-serif;
    background: url('dust2.png') center/cover no-repeat fixed;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    z-index: 1;
  }

  .open-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 100;
    background: rgba(20, 15, 10, 0.95);
    border: 2px solid #8B4513;
    border-radius: 8px;
    color: #FFA500;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    text-shadow: 1px 1px 1px #000;
    transition: all 0.15s;
    display: none;
  }
  .open-btn:hover { background: rgba(139, 69, 19, 0.7); border-color: #FFA500; }
  .open-btn.visible { display: block; }

  .menu {
    position: relative;
    z-index: 2;
    width: 96%;
    max-width: 1300px;
    height: 90vh;
    max-height: 780px;
    background: rgba(20, 15, 10, 0.92);
    border: 2px solid #8B4513;
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .menu.hidden { display: none; }

  .header {
    background: linear-gradient(180deg, #2a1a10 0%, #1a0f08 100%);
    border-bottom: 2px solid #8B4513;
    padding: 12px 24px;
    color: #FFA500;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 2px #000;
    flex-shrink: 0;
    position: relative;
  }

  .close-x {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: 1px solid #8B4513;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.5);
    color: #FFA500;
    font-size: 18px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-x:hover { background: #8B4513; color: #fff; border-color: #FFA500; }

  .body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .left {
    flex: 0 0 30%;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .left::-webkit-scrollbar { width: 4px; }
  .left::-webkit-scrollbar-thumb { background: #8B4513; border-radius: 2px; }

  .btn {
    background: rgba(10, 8, 5, 0.85);
    border: 1px solid #8B4513;
    border-radius: 3px;
    padding: 10px 14px;
    color: #FFD700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 1px 1px 1px #000;
    font-family: inherit;
    text-align: left;
  }
  .btn:hover, .btn.active {
    background: rgba(139, 69, 19, 0.5);
    border-color: #FFA500;
    color: #FFEB99;
  }
  .btn .num { color: #FFA500; font-weight: bold; min-width: 20px; }
  .btn.cancel { margin-top: auto; }
  .btn.cancel .num { color: #ff5555; }

  .right {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .files-summary {
    padding: 8px 0;
    color: #8B7355;
    font-size: 13px;
    border-bottom: 1px solid #2a1a10;
    margin-bottom: 8px;
    text-shadow: 1px 1px 1px #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .files-summary .legend {
    font-size: 11px;
    color: #6a5a4a;
  }

  .files-wrap {
    flex: 1;
    overflow: auto;
    min-height: 0;
  }
  .files-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  .files-wrap::-webkit-scrollbar-thumb { background: #8B4513; border-radius: 4px; }
  .files-wrap::-webkit-scrollbar-track { background: #1a0f08; }

  .files-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    color: #FFD700;
  }
  .files-table th {
    text-align: left;
    padding: 6px 4px;
    color: #FFA500;
    border-bottom: 1px solid #8B4513;
    position: sticky;
    top: 0;
    background: #1a0f08;
    text-shadow: 1px 1px 1px #000;
    user-select: none;
    white-space: nowrap;
    font-size: 11px;
    z-index: 2;
  }
  .files-table td {
    padding: 5px 4px;
    border-bottom: 1px solid rgba(139, 69, 19, 0.3);
    text-shadow: 1px 1px 1px #000;
    white-space: nowrap;
  }
  .files-table tr:hover td { background: rgba(139, 69, 19, 0.25); }

  .files-table tr.row-asm td {
    background: rgba(139, 69, 19, 0.18);
    font-weight: bold;
  }
  .files-table tr.row-asm:hover td { background: rgba(139, 69, 19, 0.38); }

  .files-table tr.row-prt td:first-child {
    padding-left: 24px;
  }
  .files-table tr.row-prt .fname {
    color: #c9b58a;
  }
  .files-table tr.row-other .fname {
    color: #8B7355;
  }

  .files-table .check { text-align: center; width: 32px; font-size: 13px; }
  .files-table .fname { color: #FFD700; }

  @media (max-width: 700px) {
    .menu { height: 94vh; width: 98%; border-radius: 10px; }
    .body { flex-direction: column; }
    .left { flex: 0 0 auto; max-height: 40%; }
    .right { flex: 1; }
    .header { font-size: 14px; padding: 10px 16px; }
    .files-table { font-size: 10px; }
    .files-table th { font-size: 9px; }
  }
</style>
</head>
<body>

<div class="overlay"></div>

<button class="open-btn" id="openBtn">📂 Открыть меню</button>

<div class="menu" id="menu">
  <div class="header">
    <span id="menuTitle">Buy Menu</span>
    <button class="close-x" id="closeX" title="Закрыть">×</button>
  </div>
  <div class="body">
    <div class="left" id="menuList"></div>
    <div class="right" id="rightPanel"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  МЕНЮ
// ═══════════════════════════════════════════════════════════════════
const MENU = {
  categories: [
    {
      id: "pistols",
      title: "Buy Pistols (Secondary Weapon)",
      items: [
        { name: "Glock",    img: "glock",    stats: {} },
        { name: "Yarygina", img: "yarygina", stats: {} },
        { name: "PM",       img: "pm",       stats: {} }
      ]
    },
    {
      id: "shotguns",
      title: "Buy Shotguns",
      items: [
        { name: "870",     img: "870",     stats: {} },
        { name: "590",     img: "590",     stats: {} },
        { name: "Saiga12", img: "saiga12", stats: {} }
      ]
    },
    {
      id: "smgs",
      title: "Buy Sub-Machine Guns",
      items: [
        { name: "NL 9 - 9x18",          img: "nl_9_9x18",     stats: {} },
        { name: "NL 9 - 9x19",          img: "nl_9_9x19",     stats: {} },
        { name: "NL 9 - 9x18 SE",       img: "nl_9_9x18_se",  stats: {} },
        { name: "NL 9 - 9x19 SE",       img: "nl_9_9x19_se",  stats: {} },
        { name: "NL 9 - 9x18 Tactical", img: "nl_9_9x18_tac", stats: {} },
        { name: "NL 9 - 9x19 Tactical", img: "nl_9_9x19_tac", stats: {} },
        { name: "Saiga 9",              img: "saiga9",        stats: {}, folder: "Saiga 9" }
      ]
    },
    {
      id: "rifles",
      title: "Buy Rifles (Primary Weapon)",
      items: [
        { name: "NL 15 - .223",          img: "nl15_223",   stats: {} },
        { name: "NL 15 - .308",          img: "nl15_308",   stats: {} },
        { name: "NL 15 - 6,5 Grundel",   img: "nl15_65g",   stats: {} },
        { name: "NL 15 - .300 BrownOut", img: "nl15_300bo", stats: {} },
        { name: "AK-12",                 img: "ak12",       stats: {}, folder: "AK-12" }
      ]
    },
    {
      id: "mgs",
      title: "Buy Machine Guns",
      items: [
        { name: "PK", img: "pk", stats: {}, folder: "PK" }
      ]
    }
  ],
  extras: [
    { name: "Primary Ammo",   img: "prim_ammo", stats: {} },
    { name: "Secondary Ammo", img: "sec_ammo",  stats: {} },
    { name: "Equipment",      img: "equipment", stats: {} }
  ]
};

// ═══════════════════════════════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════════════════════════════
let DATA = null;   // загруженный data.json

// ═══════════════════════════════════════════════════════════════════
//  ЭЛЕМЕНТЫ
// ═══════════════════════════════════════════════════════════════════
const menuEl      = document.getElementById('menu');
const menuTitleEl = document.getElementById('menuTitle');
const menuListEl  = document.getElementById('menuList');
const rightPanel  = document.getElementById('rightPanel');
const openBtn     = document.getElementById('openBtn');
const closeX      = document.getElementById('closeX');

// ═══════════════════════════════════════════════════════════════════
//  ЗАГРУЗКА data.json
// ═══════════════════════════════════════════════════════════════════
async function loadData() {
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error('data.json не найден — HTTP ' + resp.status);
    DATA = await resp.json();
    console.log('✅ data.json загружен:', Object.keys(DATA.folders).length, 'папок');
    return true;
  } catch (err) {
    console.error('❌ Ошибка загрузки data.json:', err);
    DATA = null;
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  ОТРИСОВКА
// ═══════════════════════════════════════════════════════════════════
let lastOpenedFolder = null;

function renderMainMenu() {
  lastOpenedFolder = null;
  menuTitleEl.textContent = 'Buy Menu';
  menuListEl.innerHTML = '';
  rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#484f58;font-style:italic;">Выбери категорию слева</div>';

  MENU.categories.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = '<span class="num">' + (i + 1) + '.</span> ' + cat.title.replace(/^Buy /, '');
    btn.addEventListener('click', () => renderCategory(cat));
    menuListEl.appendChild(btn);
  });

  MENU.extras.forEach((item, i) => {
    const num = MENU.categories.length + i + 1;
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = '<span class="num">' + num + '.</span> ' + item.name;
    btn.addEventListener('click', () => {
      rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#484f58;font-style:italic;">' + item.name + '</div>';
    });
    menuListEl.appendChild(btn);
  });

  const cancel = document.createElement('button');
  cancel.className = 'btn cancel';
  cancel.innerHTML = '<span class="num">0.</span> Cancel';
  cancel.addEventListener('click', closeMenu);
  menuListEl.appendChild(cancel);
}

function renderCategory(cat) {
  lastOpenedFolder = null;
  menuTitleEl.textContent = cat.title;
  menuListEl.innerHTML = '';
  rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#484f58;font-style:italic;">Выбери оружие слева</div>';

  cat.items.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = '<span class="num">' + (i + 1) + '.</span> ' + item.name;
    btn.addEventListener('click', () => {
      menuListEl.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (item.folder) {
        lastOpenedFolder = { folder: item.folder, name: item.name };
        renderFolder(item.folder, item.name);
      } else {
        lastOpenedFolder = null;
        rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#484f58;font-style:italic;">' + item.name + '</div>';
      }
    });
    menuListEl.appendChild(btn);
  });

  const back = document.createElement('button');
  back.className = 'btn cancel';
  back.innerHTML = '<span class="num">0.</span> Back';
  back.addEventListener('click', renderMainMenu);
  menuListEl.appendChild(back);
}

// ═══════════════════════════════════════════════════════════════════
//  ОТРИСОВКА ПАПКИ
// ═══════════════════════════════════════════════════════════════════
function renderFolder(folderName, displayName) {
  rightPanel.innerHTML = '';

  if (!DATA || !DATA.folders[folderName]) {
    rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#484f58;font-style:italic;">' +
      'Нет данных для папки «' + folderName + '».<br><br>' +
      'Проверь, что <b style="color:#FFA500;">data.json</b> лежит рядом с index.html.</div>';
    return;
  }

  const files = DATA.folders[folderName];

  // Сводка
  const asmCount = files.filter(f => f.ext === 'sldasm').length;
  const prtCount = files.filter(f => f.ext === 'sldprt').length;

  const summary = document.createElement('div');
  summary.className = 'files-summary';
  summary.innerHTML =
    '<span>' + displayName + ' — файлов: ' + files.length +
    ' (asm: ' + asmCount + ', prt: ' + prtCount + ')</span>' +
    '<span class="legend">✅ 80% &nbsp; ⚠️ 12% &nbsp; ❌ 8%</span>';
  rightPanel.appendChild(summary);

  const wrap = document.createElement('div');
  wrap.className = 'files-wrap';
  rightPanel.appendChild(wrap);

  // ==== Строим таблицу ====
  const table = document.createElement('table');
  table.className = 'files-table';

  const COLS_ASM = ['Модель', 'Сборочный', 'Габаритный'];
  const COLS_PRT = ['Модель', 'Чертёж детали', 'Габаритный', 'Технолог.', 'ОТК', 'Промо'];

  // Максимум столбцов для шапки
  const maxCols = Math.max(COLS_ASM.length, COLS_PRT.length);

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.innerHTML =
    '<th style="width:20px;"></th>' +
    '<th>Имя файла</th>' +
    '<th style="width:50px;">Расш.</th>' +
    '<th style="width:60px;">КБ</th>' +
    '<th style="width:120px;">Дата</th>';
  for (let i = 0; i < maxCols; i++) {
    headRow.innerHTML += '<th style="text-align:center;font-size:10px;">' + (COLS_PRT[i] || '') + '</th>';
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  // Разделяем: asm (с их prt) + prt без asm + другие
  const asmFiles = files.filter(f => f.ext === 'sldasm');
  const prtFiles = files.filter(f => f.ext === 'sldprt');
  const otherFiles = files.filter(f => f.ext !== 'sldasm' && f.ext !== 'sldprt');

  // Привязка prt к asm (равномерно)
  const prtToAsm = {};
  asmFiles.forEach(a => { prtToAsm[a.name] = []; });
  prtFiles.forEach((prt, idx) => {
    if (asmFiles.length > 0) {
      const parent = asmFiles[idx % asmFiles.length];
      prtToAsm[parent.name].push(prt);
    }
  });

  // Функция рендера одной строки
  function renderRow(file, isAsm, isPrt, parentAsmName) {
    const tr = document.createElement('tr');
    if (isAsm) tr.className = 'row-asm';
    else if (isPrt && parentAsmName) tr.className = 'row-prt';
    else if (isPrt) tr.className = 'row-prt';
    else tr.className = 'row-other';

    const icon = getFileIcon(file.ext);

    tr.innerHTML =
      '<td style="text-align:center;">' + icon + '</td>' +
      '<td><span class="fname">' + (isAsm ? '📦 ' : '') + escapeHtml(file.name) + '</span></td>' +
      '<td>' + file.ext + '</td>' +
      '<td>' + file.size + '</td>' +
      '<td>' + file.date + '</td>';

    const cols = isAsm ? COLS_ASM : COLS_PRT;
    const marks = file.marks || {};

    // Порядок ключей
    const keysAsm = ['model', 'assembly', 'gabari'];
    const keysPrt = ['model', 'detail', 'gabari', 'tech', 'otk', 'promo'];
    const keys = isAsm ? keysAsm : keysPrt;

    // Заполняем 6 столбцов (или сколько есть)
    for (let i = 0; i < maxCols; i++) {
      const td = document.createElement('td');
      td.className = 'check';
      if (i < cols.length) {
        const key = keys[i];
        const mark = marks[key];
        if (mark === 'ok')   td.innerHTML = '<span style="color:#4ade80;">✅</span>';
        else if (mark === 'warn') td.innerHTML = '<span style="color:#facc15;">⚠️</span>';
        else if (mark === 'no')   td.innerHTML = '<span style="color:#6b7280;">❌</span>';
        else td.textContent = '—';
      }
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  // Рендер
  asmFiles.forEach(asmFile => {
    renderRow(asmFile, true, false, null);
    // Вложенные prt
    (prtToAsm[asmFile.name] || []).forEach(prt => {
      renderRow(prt, false, true, asmFile.name);
    });
  });

  // prt без родителя (если asm нет)
  if (asmFiles.length === 0) {
    prtFiles.forEach(prt => {
      renderRow(prt, false, true, null);
    });
  }

  // Другие файлы
  otherFiles.forEach(f => {
    renderRow(f, false, false, null);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
}

function getFileIcon(ext) {
  const e = (ext || '').toLowerCase();
  if (e === 'sldprt') return '🔩';
  if (e === 'sldasm') return '🔧';
  if (e === 'pdf')    return '📄';
  if (e === 'dwg')    return '📐';
  if (e === 'err')    return '⚠️';
  return '📎';
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}

// ═══════════════════════════════════════════════════════════════════
//  ОТКРЫТЬ / ЗАКРЫТЬ
// ═══════════════════════════════════════════════════════════════════
function closeMenu() {
  menuEl.classList.add('hidden');
  openBtn.classList.add('visible');
}
function openMenu() {
  menuEl.classList.remove('hidden');
  openBtn.classList.remove('visible');
  renderMainMenu();
}
closeX.addEventListener('click', closeMenu);
openBtn.addEventListener('click', openMenu);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!menuEl.classList.contains('hidden')) closeMenu();
    else openMenu();
  }
});

// ═══════════════════════════════════════════════════════════════════
//  СТАРТ
// ═══════════════════════════════════════════════════════════════════
(async () => {
  const ok = await loadData();
  if (!ok) {
    rightPanel.innerHTML = '<div style="padding:40px;text-align:center;color:#ff6b8a;font-style:italic;">' +
      'Не удалось загрузить <b>data.json</b>.<br>' +
      'Положи его рядом с <b>index.html</b> и обнови страницу.</div>';
  }
  renderMainMenu();
})();
</script>

</body>
</html>
